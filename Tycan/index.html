<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav class="box">
            <div class="img">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSvIdPv4x3jAs69B-HzVYVrnkEKz0ANrkDAN1sb7_pIPg&s=10" alt="">

                <p>Performance</p>
                <p>Charging</p>

            </div>

            <button>TEST DRIVE</button>

        <section class="box">

                <h2 id="porsche">PORSCHE</h2>

            <div class="imgDiv">

                <div class="imgBox">
                    <img src="https://hips.hearstapps.com/hmg-prod/images/27b33d68-ae42-4cae-9d88-5c9552fd3aca.jpg?crop=0.826xw:0.697xh;0.136xw,0.259xh&resize=640:*" alt="">
